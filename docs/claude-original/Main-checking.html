<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #F3F0E8;outline-offset:3px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.p2{animation-delay:.6s}
.p3{animation-delay:1.2s}
@keyframes pulse{0%,100%{opacity:0}30%{opacity:.9}62%{opacity:0}}
.lit{animation:ignite 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes ignite{0%{opacity:0;transform:scale(.9);filter:brightness(1.8)}30%{opacity:1;transform:scale(1.06);filter:brightness(1.4)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
.wash{animation:wash 1.6s cubic-bezier(.16,1,.3,1) .1s forwards}
@keyframes wash{0%{opacity:0}35%{opacity:1}100%{opacity:.75}}
.rise{animation:rise .7s cubic-bezier(.16,1,.3,1) .45s both}
.rise2{animation:rise .7s cubic-bezier(.16,1,.3,1) .6s both}
.rise3{animation:rise .7s cubic-bezier(.16,1,.3,1) .75s both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dot{animation:dot 1s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:blink 4.6s ease-in-out infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
.scan{animation:scan 1.3s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.sadL{animation:sadL .6s cubic-bezier(.16,1,.3,1) .7s forwards}
@keyframes sadL{to{transform:translateY(1px) rotate(-16deg)}}
.sadR{animation:sadR .6s cubic-bezier(.16,1,.3,1) .7s forwards}
@keyframes sadR{to{transform:translateY(1px) rotate(16deg)}}
.upL,.upR{animation:up .6s cubic-bezier(.16,1,.3,1) .7s forwards}
@keyframes up{to{transform:translateY(-3px)}}
.grin{animation:grin .6s cubic-bezier(.16,1,.3,1) .7s forwards}
@keyframes grin{to{left:20px;width:24px;height:12px}}
.tip{animation:tip 1.2s cubic-bezier(.16,1,.3,1) .5s both}
@keyframes tip{0%{transform:translateX(-50%) rotate(-7deg)}35%{transform:translateX(-50%) translateY(-10px) rotate(-16deg)}70%,100%{transform:translateX(-50%) rotate(-7deg)}}
.breathe{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.press:active{transform:scale(.97)}
.press{transition:transform .15s cubic-bezier(.2,1.4,.4,1)}
@media (prefers-reduced-motion:reduce){.pulse,.dot,.blink,.scan,.breathe,.tip{animation:none}.lit{animation:none;opacity:1!important}.wash{animation:none;opacity:.75!important}.rise,.rise2,.rise3,.fade{animation:none}.sadL{animation:none;transform:rotate(-16deg)}.sadR{animation:none;transform:rotate(16deg)}.grin{animation:none;left:20px;width:24px;height:12px}}
</style>
